[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paotuan"
version = "0.1.0"
description = "AI互动叙事平台 · 剧本跑团客户端"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "httpx>=0.27",
    "RestrictedPython>=7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
paotuan = "paotuan.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]